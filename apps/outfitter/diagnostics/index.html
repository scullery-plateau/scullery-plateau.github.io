<html>
  <head>
    <title>Outfitter: Pattern Diagnostics</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">

    <!-- external styles -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Caudex"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Modern+Antiqua"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/d550ee8263.js"
      crossorigin
    ></script>

    <!-- project styles -->
    <link rel="stylesheet" href="../../../style/rpg.css" />
    <link rel="stylesheet" href="../../../style/font.css" />
    <link rel="stylesheet" href="../../../style/menu.css" />

    <!-- local styles -->
    <link rel="stylesheet" href="../style.css" />

    <!-- external scripts -->
    <script src="https://gizmo-atheneum.github.io/structure/importnamespace/script.js"></script>
    <script src="https://gizmo-atheneum.github.io/util/keyeventwrapper.js"></script>
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Gizmo Atheneum namespaces-->
    <script type="text/babel" src="https://gizmo-atheneum.github.io/namespaces/ajax.js"></script>
    <script type="text/babel" src="https://gizmo-atheneum.github.io/namespaces/point.js"></script>

    <!-- common namespaces -->
    <script type="text/babel" src="../../common/point.js"></script>
    <script type="text/babel" src="../../common/colorPicker.js"></script>
    <script type="text/babel" src="../../common/colors.js"></script>
    <script type="text/babel" src="../../common/dialog.js"></script>
    <script type="text/babel" src="../../common/editMode.js"></script>
    <script type="text/babel" src="../../common/fileDownload.js"></script>
    <script type="text/babel" src="../../common/fileLoader.js"></script>
    <script type="text/babel" src="../../common/progressBar.js"></script>
    <script type="text/babel" src="../../common/queryParams.js"></script>
    <script type="text/babel" src="../../common/utilities.js"></script>

    <!-- local namespaces -->
    <script type="text/babel" src="../scripts/constants.js"></script>
    <script type="text/babel" src="../scripts/dataset.js"></script>
    <script type="text/babel" src="./diagnostics.js"></script>

    <!-- bind app root -->
    <script type="text/babel">
      (function () {
        initKeyEventWrapper();
        const { Diagnostics } = imports({
          'sp.outfitter.Diagnostics': 'Diagnostics'
        });
        ReactDOM.createRoot(document.getElementById('app-root')).render(
          <Diagnostics />
        );
      })();
    </script>
  </head>
  <body class="bg-dark text-light">
    <div id="app-root" class="container-fluid"></div>
  </body>
</html>
