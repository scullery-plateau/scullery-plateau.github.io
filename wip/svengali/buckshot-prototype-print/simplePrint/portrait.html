<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portrait Test</title>
  <style>
    @media screen {
      body {
        background: #333;
        padding: 20px;
      }

      .page {
        background: white;
        width: 4.25in;
        height: 5.5in;
        margin: 0 auto 20px auto;
        overflow: hidden;
      }

      svg {
        width: 4in;
        height: 5in;
        margin-top: 0.125in;
        margin-left: 0.125in;
        border: 1px solid #ccc;
      }
    }

    @media print {
      @page {
        size: 8.5in 11in;
        margin: 0;
      }

      body {
        margin: 0;
        padding: 0;
        width: 8.5in;
        height: 11in;
      }

      .page {
        width: 8.5in;
        height: 11in;
        page-break-after: always;
        overflow: hidden;
      }

      .page:last-child {
        page-break-after: auto;
      }

      svg {
        width: 8in;
        height: 10in;
        margin-top: 0.25in;
        margin-left: 0.25in;
        display: block;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <svg viewBox="0 0 800 1000">
      <rect x="0" y="0" width="800" height="1000" fill="none" stroke="black" stroke-width="2" />
      <rect x="25" y="25" width="750" height="950" fill="none" stroke="red" stroke-width="2" />
      <text x="400" y="500" font-family="Arial" font-size="40" text-anchor="middle" dominant-baseline="middle">Portrait
        Page 1 (8x10)</text>
    </svg>
  </div>
  <div class="page">
    <svg viewBox="0 0 800 1000">
      <rect x="0" y="0" width="800" height="1000" fill="none" stroke="black" stroke-width="2" />
      <rect x="25" y="25" width="750" height="950" fill="none" stroke="red" stroke-width="2" />
      <text x="400" y="500" font-family="Arial" font-size="40" text-anchor="middle" dominant-baseline="middle">Portrait
        Page 2 (8x10)</text>
    </svg>
  </div>
</body>

</html>
